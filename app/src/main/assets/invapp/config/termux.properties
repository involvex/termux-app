# InVxTermux — Termux app properties (phone + container seed).
# After edits: termux-reload-settings, or Settings → Customize keybinds.

night-mode=true

# Plain text labels (HOME/END/CTRL), not ISO glyphs. Customize keys forces this.
extra-keys-style=none

# Page 1 = nav/modifiers (text). Page 2 = workflow — swipe the key bar L/R.
extra-keys=[[[{key: 'ESC', display: 'ESC'},{key: '/', display: '/'},{key: '-', popup: '|', display: '-'},{key: 'HOME', display: 'HOME'},{key: 'UP', display: 'UP'},{key: 'END', display: 'END'},{key: 'PGUP', display: 'PGUP'}],[{key: 'TAB', display: 'TAB'},{key: 'CTRL', display: 'CTRL'},{key: 'ALT', display: 'ALT'},{key: 'LEFT', display: 'LEFT'},{key: 'DOWN', display: 'DOWN'},{key: 'RIGHT', display: 'RIGHT'},{key: 'PGDN', display: 'PGDN'}]],[[{key: 'PULL', display: 'pull'},{key: 'BUNI', display: 'bun i'},{key: 'DEV', display: 'dev'},{key: 'REPOS', display: 'repos'}],[{key: 'CLONE', display: 'clone'},{key: 'AI', display: 'AI'},{key: 'DRAWER', display: 'drawer'},{key: 'DRAWER_RIGHT', display: 'tools'},{key: 'KEYBOARD', display: 'kbd'},{key: 'PASTE', display: 'paste'}]]]

erase-history=false
