version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  commit-message:
    # Prefix all commit messages with "Changed: "
    prefix: "Changed"

- package-ecosystem: gradle
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: "Changed"
  # Group minor/patch only so Dependabot does not open noisy major PRs.
  groups:
    gradle-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
  # Block majors that need an all-ABI bootstrap rebuild or break minSdk 21.
  ignore:
  - dependency-name: "com.android.tools.build:gradle"
    update-types: ["version-update:semver-major"]
  - dependency-name: "commons-io:commons-io"
    # Cap at 2.5 for Android < 8 (java.nio.file.Path). Revisit at minSdk 26.
    versions: [">2.5"]
  # Material 1.14+ AAR minSdk is 23 (fork stays on 21).
  - dependency-name: "com.google.android.material:material"
    versions: [">=1.13.0"]
  # Robolectric 4.18+ drops SDK support below 24; tests stay on 4.10.
  - dependency-name: "org.robolectric:robolectric"
    versions: [">4.10"]
  # Biometric lock deferred (Phase 20); keep alpha until a dedicated batch.
  - dependency-name: "androidx.biometric:biometric"
    versions: [">1.2.0-alpha05"]
  # HiddenApiBypass 6.2 requires compileSdk 37; fork is on 36.
  - dependency-name: "org.lsposed.hiddenapibypass:hiddenapibypass"
    versions: [">6.1"]
  # appcompat 1.8+ / media 1.8+ require minSdk 23; work-runtime 2.12+ requires 24.
  - dependency-name: "androidx.appcompat:appcompat"
    versions: [">=1.8.0"]
  - dependency-name: "androidx.media:media"
    versions: [">=1.8.0"]
  - dependency-name: "androidx.work:work-runtime"
    versions: [">=2.10.0"]
  # NDK is pinned in gradle.properties (ndkVersion), not a Maven artifact;
  # AGP major bumps are ignored above. No separate NDK ignore entry needed.
