name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Setup java 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Show java version
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        echo "LANG=$LANG file.encoding probe:"
        java -XshowSettings:properties -version 2>&1 | grep file.encoding || true
    - name: Execute tests
      run: |
        ./gradlew test
