buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// AGP creates JavaCompile tasks lazily — apply encoding after evaluation so
// unit-test compilation (and CI without a UTF-8 locale default) stays UTF-8.
subprojects {
    afterEvaluate {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
        }
    }
}
