# InVxTermux container -- Termux app properties.
# The container has no terminal emulator, so these only matter if you mount a
# project into the same ~/.termux on a phone. Kept identical to what the app
# seeds so a project behaves the same on both sides.

# Night mode is what makes the hacker theme readable on OLED.
night-mode=true

# Two-row nav bar, matching the app's default extra-keys layout.
extra-keys=\
[['left','up','right','down'],\
['HOME','UP','END','PGUP'],\
['LEFT','DOWN','RIGHT','PGDN'],\
['TAB','CTRL','ALT','ESC']]

# Keep history across restarts (useful in long-lived containers).
erase-history=false
