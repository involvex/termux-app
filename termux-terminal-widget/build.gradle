plugins {
    id "com.android.application"
}

android {
    namespace "com.gardockt.termuxterminalwidget"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        // Sibling of InVxTermux — not classic Termux:Widget (.widget / ~/.shortcuts).
        applicationId "com.involvex.termux_app.terminalwidget"
        minSdkVersion 24
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 4
        versionName "1.2.0"

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.involvex.termux_app"
        manifestPlaceholders.TERMUX_APP_NAME = "InVxTermux"
        manifestPlaceholders.TERMUX_TERMINAL_WIDGET_APP_NAME = "InVx Terminal Widget"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            resValue 'string', 'app_name', 'InVx Terminal Widget'
        }

        debug {
            // No applicationIdSuffix — keep one id for install beside InVxTermux.
            signingConfig signingConfigs.debug
            resValue 'string', 'app_name', 'InVx Terminal Widget (Debug)'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        exclude "lib/*/libtermux.so"
        exclude "lib/*/liblocal-socket.so"
        exclude "lib/*/libinvapp-redirector.so"
    }

    lint {
        abortOnError false
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.jaredrummler:colorpicker:1.1.0"
    implementation "com.google.guava:guava:24.1-jre"
    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    implementation "io.reactivex.rxjava3:rxjava:3.1.8"

    implementation project(":termux-shared")
}
